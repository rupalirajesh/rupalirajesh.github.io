title: Rupali Rajesh
description: LLMs | AI
url: "https://rupalirajesh.github.io"
baseurl: ""
remote_theme: mmistakes/minimal-mistakes@4.19.3
theme: null
 
# Site Author
author:
  name: "Website of Rupali Rajesh"
  bio: "Artificial Intelligence student focused on Language Models."
  location: "Chennai, Tamil Nadu, IN"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/rupalirajesh"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/rupali-rajesh-01788028b/"

# Build settings
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache    # ← THIS IS CRITICAL
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

# Pagination
paginate: 5
paginate_path: /page:num/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

after_footer_scripts:
  - mathjax.html
